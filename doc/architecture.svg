<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" font-family="'Segoe UI', 'Noto Sans KR', sans-serif">
  <defs>
    <style>
      .layer { fill:#f5f7fb; stroke:#4f6fad; stroke-width:2; }
      .service { fill:#fdf4e3; stroke:#c77d1a; stroke-width:2; }
      .data { fill:#eef7f1; stroke:#3c8d40; stroke-width:2; }
      .accent { fill:#f6e8ff; stroke:#7b50c1; stroke-width:2; }
      .text { font-size:14px; font-weight:600; fill:#1f2f46; }
      .small { font-size:13px; font-weight:500; fill:#2d3e5f; }
      .title { font-size:18px; font-weight:700; fill:#1a2b49; }
      marker#arrow { markerWidth: 10; markerHeight: 10; refX: 5; refY: 3; orient: auto; markerUnits: strokeWidth; }
      marker#arrow path { fill: #2c3e50; }
      marker#arrowOrange path { fill: #c77d1a; }
      marker#arrowGreen path { fill: #3c8d40; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" />
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" />
    </marker>
  </defs>

  <rect x="20" y="30" width="270" height="110" rx="12" class="layer" />
  <text x="40" y="65" class="title">프런트엔드 &amp; 진입점</text>
  <text x="40" y="95" class="small">• 사용자 브라우저 (Tiles + JSP)</text>
  <text x="40" y="120" class="small">• 정적 리소스 / REST 호출</text>

  <rect x="320" y="40" width="240" height="90" rx="12" class="accent" />
  <text x="340" y="75" class="title">Spring Security 필터체인</text>
  <text x="340" y="105" class="small">세션 관리, 접근 제어, 커스텀 핸들러</text>

  <rect x="600" y="30" width="250" height="120" rx="12" class="layer" />
  <text x="620" y="65" class="title">MVC/REST 컨트롤러</text>
  <text x="620" y="95" class="small">Auth, Board/Q&amp;A/Review, Reservation,</text>
  <text x="620" y="115" class="small">AI 경로, 날씨, Admin, MyPage 등</text>

  <rect x="890" y="30" width="190" height="140" rx="12" class="service" />
  <text x="910" y="65" class="title">서비스 계층</text>
  <text x="910" y="95" class="small">AiService / GeminiService</text>
  <text x="910" y="115" class="small">WeatherService / OpenWeatherService</text>
  <text x="910" y="135" class="small">Reservation·Board·MyPage 서비스</text>

  <rect x="890" y="220" width="190" height="120" rx="12" class="data" />
  <text x="910" y="255" class="title">MyBatis Mapper</text>
  <text x="910" y="285" class="small">AiMapper, ReservationMapper,</text>
  <text x="910" y="305" class="small">Board/Review/NoticeMapper 등</text>

  <rect x="890" y="400" width="190" height="110" rx="12" class="data" />
  <text x="930" y="435" class="title">Oracle DB</text>
  <text x="910" y="465" class="small">여행 경로, 예약, 게시판,</text>
  <text x="910" y="485" class="small">회원, 헬스케어 로그 데이터</text>

  <rect x="40" y="210" width="260" height="110" rx="12" class="service" />
  <text x="60" y="245" class="title">외부 연동 서비스</text>
  <text x="60" y="275" class="small">Gemini API (AI 경로 생성)</text>
  <text x="60" y="295" class="small">OpenWeatherMap API (날씨)</text>

  <rect x="330" y="220" width="240" height="110" rx="12" class="layer" />
  <text x="350" y="255" class="title">공통 컴포넌트</text>
  <text x="350" y="285" class="small">예외 처리, 인증 토큰 관리,</text>
  <text x="350" y="305" class="small">파일 업로드, Tiles 뷰 레이아웃</text>

  <line x1="290" y1="85" x2="320" y2="85" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arrow)" />
  <line x1="560" y1="85" x2="600" y2="85" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arrow)" />
  <line x1="850" y1="90" x2="890" y2="90" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arrow)" />
  <line x1="985" y1="170" x2="985" y2="220" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arrow)" />
  <line x1="985" y1="340" x2="985" y2="400" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arrow)" />

  <line x1="225" y1="320" x2="890" y2="320" stroke="#c77d1a" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrowOrange)" />
  <text x="240" y="343" class="small" fill="#c77d1a">서비스 계층에서 외부 API 호출</text>

  <line x1="470" y1="140" x2="470" y2="220" stroke="#7b50c1" stroke-width="2" marker-end="url(#arrow)" />
  <text x="490" y="185" class="small">공통 기능</text>

  <line x1="220" y1="145" x2="220" y2="210" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)" />
  <text x="90" y="185" class="small">대시보드·알림용</text>

  <rect x="600" y="200" width="250" height="120" rx="12" class="accent" />
  <text x="620" y="235" class="title">실시간/메시징</text>
  <text x="620" y="265" class="small">WebSocket + STOMP 알림</text>
  <text x="620" y="285" class="small">채팅, 예약 알림, 신고 전달</text>

  <line x1="725" y1="150" x2="725" y2="200" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)" />

  <line x1="890" y1="260" x2="850" y2="260" stroke="#3c8d40" stroke-width="2.5" marker-end="url(#arrowGreen)" />
  <text x="690" y="245" class="small">MyBatis 매퍼 호출</text>
</svg>
